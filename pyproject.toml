[project]
name = "llm-cache"
version = "0.1.0"
description = "Semantic cache for LLM responses, backed by Postgres and pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

# Kept out of the base install: importing this package should not drag the
# whole LangChain stack into someone else's dependency tree.
[project.optional-dependencies]
langchain = [
    "langchain-core>=1.4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cache"]

[dependency-groups]
dev = [
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: needs a live Postgres with pgvector (see docker-compose.yml)",
]
