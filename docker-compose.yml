services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: llm-cache-postgres
    environment:
      - POSTGRES_USER=llmcache
      - POSTGRES_PASSWORD=llmcache
      - POSTGRES_DB=llmcache
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U llmcache -d llmcache']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
